<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar | Painel Administrativo PACO Móveis</title>
    

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232b7fff'/><text x='50' y='64' font-family='sans-serif' font-weight='900' font-size='32' fill='white' text-anchor='middle'>PACO</text></svg>">
    
    <!-- Defer CSS -->
    <link rel="preload" href="css/antigravity.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/antigravity.min.css"></noscript>
    <!-- Defer CSS -->
    <link rel="preload" href="css/login.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/login.css"></noscript>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-storage-compat.js" defer></script>
    
    <script src="js/firebase-config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" aria-label="Ir para a página inicial">
                    <img src="assets/logo.webp" alt="PACO Móveis" class="login-logo">
                </a>
                <h1>Acesso Administrativo</h1>
                <p>Gerencie produtos, estoque, acabamentos e vitrine</p>
            </div>

            <div id="login-alert" class="login-alert" role="alert"></div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="admin-email">E-mail</label>
                    <div class="login-input-wrapper">
                        <input type="email" id="admin-email" placeholder="admin@pacomoveis.com.br" required autocomplete="email" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="admin-password">Senha</label>
                    <div class="login-input-wrapper">
                        <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btn-login-submit" class="login-btn-primary">
                    <span id="btn-text">Entrar no Painel</span>
                    <span id="btn-spinner" style="display: none;">Acessando...</span>
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html">← Voltar para a Loja PACO</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('admin-email');
            const passInput = document.getElementById('admin-password');
            const alertBox = document.getElementById('login-alert');
            const btnSubmit = document.getElementById('btn-login-submit');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            function showAlert(msg, type = 'error') {
                alertBox.textContent = msg;
                alertBox.className = `login-alert ${type}`;
                alertBox.style.display = 'block';
            }

            // Checa se já está logado
            const user = await Auth.getCurrentUser();
            if (user) {
                window.location.href = 'admin.html';
                return;
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const email = emailInput.value;
                const password = passInput.value;

                btnSubmit.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline';

                if (!FirebaseService.isConfigured) {
                    showAlert('Serviço de autenticação temporariamente indisponível.', 'error');
                    btnSubmit.disabled = false;
                    btnText.style.display = 'inline';
                    btnSpinner.style.display = 'none';
                    return;
                }

                try {
                    await Auth.signIn(email, password);
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || 'admin.html';
                    window.location.href = redirect;
                } catch (err) {
                    console.error('Erro de autenticação:', err);
                    showAlert(err.message || 'Erro ao autenticar. Verifique email e senha.', 'error');
                    btnSubmit.disabled = false;
                    btnText.style.display = 'inline';
                    btnSpinner.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
