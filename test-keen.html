<!DOCTYPE html>
<html>
<head>
    <!-- Defer CSS -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/keen-slider@6.8.6/keen-slider.min.css" as="style" integrity="sha384-c33HE1mLXmDEd7Ir2k6bCPjErFY+gVW8y6h8x7HN5BHlqc7KFbvhXd8uO5eTPcVZ" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/keen-slider@6.8.6/keen-slider.min.css" integrity="sha384-c33HE1mLXmDEd7Ir2k6bCPjErFY+gVW8y6h8x7HN5BHlqc7KFbvhXd8uO5eTPcVZ" crossorigin="anonymous"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/keen-slider@6.8.6/keen-slider.min.js" integrity="sha384-9eF9f0UaIDWPhfrk52yj49UhvXk0aNj+hFlIIhcYBvgkp6T8uK+e5rTrV2GtCBQs" crossorigin="anonymous" defer></script>
</head>
<body>
    <div id="my-keen-slider" class="keen-slider">
      <div class="keen-slider__slide number-slide1">1</div>
      <div class="keen-slider__slide number-slide2">2</div>
      <div class="keen-slider__slide number-slide3">3</div>
    </div>
    <button id="prev">Prev</button>
    <button id="next">Next</button>
    <script>
      var slider = new KeenSlider("#my-keen-slider");
      console.log(slider);
      console.log(typeof slider.next);
    </script>
</body>
</html>
