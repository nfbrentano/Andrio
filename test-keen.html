<!DOCTYPE html>
<html>
<head>
    <!-- Defer CSS -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/keen-slider@latest/keen-slider.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/keen-slider@latest/keen-slider.min.css"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/keen-slider@latest/keen-slider.min.js"></script>
</head>
<body>
    <div id="my-keen-slider" class="keen-slider">
      <div class="keen-slider__slide number-slide1">1</div>
      <div class="keen-slider__slide number-slide2">2</div>
      <div class="keen-slider__slide number-slide3">3</div>
    </div>
    <button id="prev">Prev</button>
    <button id="next">Next</button>
    <script>
      var slider = new KeenSlider("#my-keen-slider");
      console.log(slider);
      console.log(typeof slider.next);
    </script>
</body>
</html>
