<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de produtos rápidos, modernos e acessíveis com a exclusiva estética Bauhaus. Encontre o que você precisa com facilidade.">
    <meta name="keywords" content="e-commerce, bauhaus, produtos premium, catálogo estático, site do andrio">
    <meta name="author" content="Andrio">
    
    <!-- Open Graph (SEO Redes Sociais) -->
    <meta property="og:title" content="E-commerce Estático | Site do Andrio">
    <meta property="og:description" content="Encontre fones de ouvido, capas protetoras e carregadores premium com design Bauhaus.">
    <meta property="og:image" content="assets/logo.jpg">
    <meta property="og:type" content="website">

    <title>E-commerce Estático | Site do Andrio</title>
    
    <link rel="stylesheet" href="css/antigravity.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="ag-navbar">
        <div class="logo">
            <a href="#home">
                <img src="assets/logo.jpg" alt="Logo Andrio Bauhaus" width="100" height="90" style="border-radius: 8px; object-fit: cover;">
            </a>
        </div>
        <nav>
            <div id="filtros" class="ag-navbar-filters">
                <button class="ag-btn filter-btn active" data-category="all">Todos</button>
                <button class="ag-btn filter-btn" data-category="sofa">Sofás</button>
                <button class="ag-btn filter-btn" data-category="poltrona">Poltronas</button>
                <button class="ag-btn filter-btn" data-category="mesa">Mesas</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="home" class="hero-section ag-container">
            <h1>Coleção Bauhaus</h1>
            <p>Descubra produtos selecionados que unem utilidade e beleza através de formas geométricas minimalistas e cores vibrantes.</p>
        </section>

        <section id="catalogo" class="ag-grid ag-container">
            <!-- Os cards dos produtos serão injetados dinamicamente via Javascript -->
        </section>
    </main>

    <footer>
        <div class="ag-container">
            <p>&copy; 2026 E-commerce Estático do Andrio. Todos os direitos reservados.</p>
            <p style="margin-top: 10px; font-size: 0.8rem; color: #666;">Desenvolvido com <span style="color: var(--cor-vermelho);">&#9632;</span> <span style="color: var(--cor-amarelo);">&#9650;</span> <span style="color: var(--cor-azul);">&#9679;</span> no Antigravity.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
